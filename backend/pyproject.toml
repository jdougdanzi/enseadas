[project]
name = "enseadas-backend"
version = "0.1.0"
description = "API e painel da revista EnseadaS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<6.0",
    "django-allauth>=65.0",
    "django-ninja>=1.3",
    "django-cors-headers>=4.6",
    "django-environ>=0.11",
    "django-ratelimit>=4.1",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
# Migrações são geradas pelo Django: não vale reescrevê-las à mão.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
